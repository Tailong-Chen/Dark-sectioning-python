[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dark-sectioning"
version = "0.1.0"
description = "Python library and CLI port of the MATLAB_Code/Dark.m Dark-sectioning workflow."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
  { name = "Ruijie Cao and Peng Xi", email = "caoruijie@stu.pku.edu.cn" },
]
maintainers = [
  { name = "Tailong Chen" },
]
dependencies = [
  "numpy>=1.23",
  "scipy>=1.9",
  "tifffile>=2022.8.12",
]

[project.optional-dependencies]
test = [
  "pytest>=7",
]

[project.scripts]
dark-section = "dark_sectioning.cli:main"

[tool.setuptools.packages.find]
include = ["dark_sectioning*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "slow: bundled full-stack parity tests",
  "matlab: tests that require MATLAB Engine",
]
